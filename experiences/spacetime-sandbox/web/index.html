      body {
        margin: 0;
        height: 100%;
        background: #0b0a0c;
        overflow: hidden;
      }
    </style>

      BYU-PCCL's messaging client, vendored as a UMD build because the wall's
      shell has no package registry and the experience is served from a static
      folder. It defines window.FootronMessaging; src/input/phone.ts picks it
      up from there, and does nothing at all if it is missing.
    -->
    <script src="./footron-messaging.development.js"></script>
