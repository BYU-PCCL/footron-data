<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Barnsley's Fern</title>
<style>
  /* Night palette: the fern is light on a dark room. The wall is a large
     emissive panel in a space that is usually dim, so ink-on-paper reads as a
     slab of glare from across the room -- the picture is inverted instead, and
     every map color is lifted to something that still separates against black. */
  :root {
    --bg: #080b09;
    --ink: #edf3ee;
    --dim: #93aa99;
    --accent: #5fe0a0;
    --stem: #c9a260;
    --left: #56c8eb;
    --right: #f2b746;
    --line: rgba(226, 236, 229, 0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  #c { position: fixed; inset: 0; display: block; }

  /* Nothing here is pointer-interactive any more: the fern is full-bleed and
     the five knobs live on a visitor's phone. Off the wall the keyboard stands
     in for the phone (see #hint), so the page still drives itself under a
     plain file server without a control surface drawn over the picture. */
  .hud { position: fixed; pointer-events: none; }

  /* The fern fills the screen, tilted across the middle, and the writing is
     laid over its margins: the piece and its plant name top-left, the count
     top-right, the narration down the left side, and the four maps bottom-
     right. BAND in app.js sizes the picture so the ink stays clear of these. */
  #title {
    left: clamp(20px, 3vw, 64px);
    top: clamp(20px, 3.2vh, 56px);
    width: min(26vw, 480px);
  }
  #title h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(24px, 2.6vw, 54px);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.05;
    color: var(--accent);
  }
  /* Which plant the wall is drawing right now. The unattended loop works
     through the named ones, and a phone can put any numbers at all up there,
     so the sheet has to say what is actually on it. */
  #plant {
    margin-top: 0.6em;
    font-size: clamp(11px, 0.95vw, 20px);
    color: var(--dim);
    line-height: 1.5;
  }
  #plant b { color: var(--ink); font-weight: 500; }
  #plant .note { color: rgba(147, 170, 153, 0.75); }

  /* The narration: one beat at a time down the left side, fading from one to
     the next on its own clock, so the piece explains itself to whoever walks
     up mid-draw. Held off the ink by a blurred panel rather than by margins,
     because the fern is full-bleed now and the margins are its corners.

     This is the one block on the sheet somebody is expected to *read*, from
     across a dim room, in the twenty seconds a beat is up — so it is set
     larger and looser than anything else here, and it is the copy that gets
     the width rather than the fern. */
  #narrate {
    left: clamp(20px, 3vw, 64px);
    top: 50%;
    transform: translateY(-50%);
    width: min(25vw, 480px);
    max-height: 56vh;
    padding: clamp(16px, 1.4vw, 28px) clamp(18px, 1.6vw, 32px);
    border-radius: 12px;
    background: rgba(8, 11, 9, 0.42);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    font-size: clamp(13px, 1.25vw, 26px);
    line-height: 1.65;
    color: rgba(237, 243, 238, 0.92);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #narrate.visible { opacity: 1; }
  #narrate b { color: var(--accent); font-weight: 500; }

  #readout {
    top: clamp(20px, 3.2vh, 56px);
    right: clamp(20px, 3vw, 64px);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #readout .big {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 5vw, 108px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--accent);
  }
  #readout .sub {
    margin-top: 0.5em;
    font-size: clamp(11px, 0.95vw, 20px);
    color: var(--dim);
    line-height: 1.6;
  }
  #readout .sub span { color: var(--ink); }

  /* The four maps, with their dice odds and the share of points they own.
     Same blurred panel as the narration, and for the same reason: the fern is
     full-bleed, so this is over the bottom-right corner of its box. A broad
     plant -- Feather, or something a phone bent wider still -- puts real ink
     up here, and the six coefficients per map are the smallest type on the
     sheet. */
  #foot {
    right: clamp(20px, 3vw, 64px);
    bottom: clamp(18px, 3vh, 48px);
    width: min(27vw, 520px);
    padding: clamp(14px, 1.3vw, 26px) clamp(16px, 1.5vw, 30px);
    border-radius: 12px;
    background: rgba(8, 11, 9, 0.42);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: clamp(8px, 1.1vh, 18px);
  }
  #legend {
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: clamp(9px, 1.1vh, 20px);
    font-variant-numeric: tabular-nums;
  }
  .card {
    display: grid;
    grid-template-columns: auto auto 1fr;
    align-items: center;
    gap: clamp(9px, 1vw, 20px);
  }
  .card .swatch {
    width: clamp(7px, 0.55vw, 12px);
    height: clamp(7px, 0.55vw, 12px);
    border-radius: 50%;
  }
  .card .mat {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: clamp(8.5px, 0.72vw, 15px);
    line-height: 1.35;
    color: var(--dim);
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 0 0.7em;
    text-align: right;
  }
  .card .mat .plus { color: rgba(147, 170, 153, 0.55); }
  .card .meta { line-height: 1.4; }
  .card .name {
    font-size: clamp(11px, 0.95vw, 20px);
    color: var(--ink);
  }
  .card .what {
    font-size: clamp(9.5px, 0.78vw, 16px);
    color: rgba(147, 170, 153, 0.8);
    line-height: 1.45;
  }
  .card .odds {
    font-size: clamp(9.5px, 0.78vw, 16px);
    color: var(--dim);
  }
  .card .odds i { font-style: normal; color: var(--ink); }

  #hint {
    font-size: clamp(10px, 0.8vw, 16px);
    color: rgba(147, 170, 153, 0.7);
    text-align: right;
    line-height: 1.7;
  }
  #hint b { color: var(--dim); font-weight: 500; }

  /* shed the least essential rows first on small or short screens */
  @media (max-height: 900px) { .card .what { display: none; } }
  @media (max-width: 1100px) { #legend .mat { display: none; } }
  @media (max-width: 820px) { #narrate, #hint { display: none; } }
  @media (max-width: 720px) { #legend, #plant { display: none; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud" id="title">
    <h1>Barnsley&rsquo;s Fern</h1>
    <div id="plant"></div>
  </div>

  <div class="hud" id="narrate"></div>

  <div class="hud" id="readout">
    <div class="big" id="ro-big"></div>
    <div class="sub" id="ro-sub"></div>
  </div>

  <div class="hud" id="foot">
    <div id="legend"></div>
    <div id="hint"></div>
  </div>

  <!-- The wall's phone-controls client. A plain script, not a module: it is a
       UMD build that defines globalThis.FootronMessaging, and footron.js treats
       its absence as "no phone controls" rather than as an error. -->
  <script src="vendor/footron-messaging.min.js"></script>
  <script src="footron.js"></script>
  <script src="app.js"></script>
</body>
</html>
