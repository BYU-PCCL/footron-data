<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Data Structures</title>
<style>
  /* Night palette. The wall is a large emissive panel in a dim room, so the
     sheet is near-black and every accent is a desaturated mid-tone that still
     separates against it. Keep these in sync with DS.C in js/core.js. */
  :root {
    --bg: #0a0d12;
    --ink: #e3e6ed;
    --dim: #8a92a4;
    --mute: #5b6376;
    --line: rgba(190, 200, 220, 0.16);
    --teal: #6cc3b2;
    --amber: #e2b25f;
    --rose: #d27b83;
    --gutter: clamp(20px, 3vw, 72px);
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 90% 80% at 50% 48%, #10141c 0%, var(--bg) 70%) var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #c { position: fixed; inset: 0; display: block; transition: opacity 0.1s linear; }
  .hud { position: fixed; pointer-events: none; }

  /* ---- top-left: which structure, and the one idea it exists to show ---- */
  #title { left: var(--gutter); top: clamp(18px, 3.4vh, 64px); width: min(58vw, 1400px); }
  #eyebrow {
    font-family: var(--mono);
    font-size: clamp(10px, 0.72vw, 18px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  #eyebrow b { color: var(--dim); font-weight: 500; }
  #name {
    margin-top: 0.25em;
    font-size: clamp(26px, 2.7vw, 68px);
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1.05;
  }
  #idea {
    margin-top: 0.4em;
    font-size: clamp(14px, 1.3vw, 34px);
    line-height: 1.45;
    color: var(--dim);
    max-width: 44em;
    color: var(--ink);
    opacity: 0.85;
  }

  /* colour key: what the colours in the picture mean, so it reads without narration */
  #legend { margin-top: 0.7em; display: flex; flex-wrap: wrap; gap: 0.35em 1.4em; font-size: clamp(12px, 0.9vw, 24px); color: var(--dim); }
  #legend span { display: inline-flex; align-items: center; gap: 0.5em; white-space: nowrap; }
  #legend i { width: 0.8em; height: 0.8em; border-radius: 3px; display: inline-block; }

  /* ---- top-right: live numbers ---- */
  #stats {
    right: var(--gutter);
    top: clamp(18px, 3.4vh, 64px);
    display: flex;
    gap: clamp(16px, 2vw, 56px);
    text-align: right;
  }
  .stat .v {
    font-family: var(--mono);
    font-size: clamp(18px, 1.75vw, 44px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stat .v.accent { color: var(--amber); }
  .stat.hero .v { font-size: clamp(28px, 3vw, 80px); }
  .stat.hero .k { font-family: var(--sans); font-size: clamp(11px, 0.9vw, 24px); letter-spacing: 0; text-transform: none; color: var(--dim); max-width: 16em; margin-left: auto; }
  #stats { align-items: flex-end; }
  .stat .k {
    margin-top: 0.3em;
    font-family: var(--mono);
    font-size: clamp(10px, 0.7vw, 18px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* ---- bottom-centre: what just happened, and why it matters ----
     The bottom-left corner is Footron's: its QR card is painted there. */
  #captions {
    left: 50%;
    transform: translateX(-50%);
    bottom: clamp(18px, 4.2vh, 80px);
    width: min(56vw, 1500px);
    text-align: center;
    transition: bottom 0.3s ease;
  }
  body.dock-on #captions { bottom: 168px; }
  #op {
    font-family: var(--mono);
    font-size: clamp(12px, 0.95vw, 24px);
    color: var(--ink);
    min-height: 1.5em;
    transition: opacity 0.5s ease, color 0.3s ease;
  }
  #op.good { color: var(--teal); }
  #op.warn { color: var(--amber); }
  #op.bad  { color: var(--rose); }
  #op.stale { opacity: 0.35; }
  #note {
    margin-top: 0.55em;
    font-size: clamp(13px, 1.05vw, 26px);
    line-height: 1.45;
    color: var(--dim);
    min-height: 1.45em;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #note.visible { opacity: 1; }

  /* ---- bottom-right: where we are in the loop, and who is driving ---- */
  #where {
    right: var(--gutter);
    bottom: clamp(18px, 4.2vh, 80px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    transition: bottom 0.3s ease;
  }
  body.dock-on #where { bottom: 168px; }
  #mode {
    font-family: var(--mono);
    font-size: clamp(9px, 0.62vw, 15px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mute);
  }
  #mode.live { color: var(--amber); }
  #dots { display: flex; gap: clamp(4px, 0.28vw, 8px); align-items: center; }
  #dots i {
    display: block;
    width: clamp(4px, 0.26vw, 7px);
    height: clamp(4px, 0.26vw, 7px);
    border-radius: 50%;
    background: var(--mute);
    opacity: 0.45;
    transition: all 0.4s ease;
  }
  #dots i.on { background: var(--ink); opacity: 1; width: clamp(14px, 1vw, 26px); border-radius: 4px; }
  #bar { width: clamp(120px, 9vw, 260px); height: 2px; background: var(--line); overflow: hidden; }
  #bar div { height: 100%; width: 0; background: var(--dim); }

  /* ---- the desktop dock: the interactive version off the wall ----
     On the wall a visitor's phone is the input (body.footron hides this). */
  #dock {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: rgba(16, 20, 28, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: min(calc(100vw - 32px), 1500px);
  }
  body.dock-on #dock { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  body.footron #dock { display: none; }
  body.single #dots, body.single #bar, body.single #dock-scenes { display: none; }
  body.single #dock-scenes + .row { border-top: 0; padding-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .row + .row { border-top: 1px solid var(--line); padding-top: 8px; }
  #dock button {
    font: 500 13px var(--sans);
    color: var(--dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  #dock button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
  #dock button.on { color: var(--ink); border-color: var(--line); background: rgba(255, 255, 255, 0.06); }
  #dock button.act { color: var(--ink); border-color: rgba(226, 178, 95, 0.35); }
  #dock button.act:hover { background: rgba(226, 178, 95, 0.12); }
  #dock .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #dock .grp { font: 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); margin: 0 2px 0 10px; }
  #dock .grp:first-child { margin-left: 0; }
  #dock kbd { font: 11px var(--mono); color: var(--mute); margin-left: 4px; }

</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud" id="title">
    <div id="eyebrow"></div>
    <div id="name"></div>
    <div id="idea"></div>
    <div id="legend"></div>
  </div>
  <div class="hud" id="stats"></div>
  <div class="hud" id="captions">
    <div id="op"></div>
    <div id="note"></div>
  </div>
  <div class="hud" id="where">
    <div id="mode">autoplay</div>
    <div id="dots"></div>
    <div id="bar"><div></div></div>
  </div>

  <div id="dock">
    <div class="row" id="dock-scenes"></div>
    <div class="row" id="dock-actions"></div>
  </div>

  <!-- Messaging client for the phone controls (UMD, defines FootronMessaging).
       footron.js is a no-op when it is absent or when we are not on the wall. -->
  <script src="vendor/footron-messaging.min.js"></script>
  <script src="footron.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scenes/hnsw.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
