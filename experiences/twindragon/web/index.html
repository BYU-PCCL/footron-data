// failure in the vendored libraries below is visible on the wall too --
// when this lived further down in <body>, a head-script failure left a
// black screen and the real cause never reached the overlay. The overlay
// element doesn't exist yet at this point, so it's looked up lazily.
function showError(message) {
    console.error(message);
    const overlay = document.getElementById('error-overlay');
    if (!overlay) {
        // Failed before <body> parsed -- hold it until the DOM is ready.
        document.addEventListener('DOMContentLoaded', () => showError(message));
        return;
    }
    overlay.textContent = String(message);
    overlay.style.display = 'block';
}
window.addEventListener('error', (e) => {
    showError((e.error && e.error.stack) || e.message || String(e));
});
window.addEventListener('unhandledrejection', (e) => {
    showError('Unhandled promise rejection: ' + ((e.reason && e.reason.stack) || e.reason));
});

  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #info-overlay {
    position: fixed;
    left: 10%;
    bottom: 50vh;
    transform: translateX(-50%) translateY(50%);
    max-width: 20vw;
    padding: 18px 22px;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.92);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: clamp(1rem, 1.5vw, 2rem);
    line-height: 1.5;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  #info-overlay.visible {
    opacity: 1;
  }

  /* Surfaces JS errors directly on the wall screen -- there's no devtools
     access to the kiosk, so this is the only way to see why the display
     might be black. */
  #error-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    padding: 24px;
    background: rgba(80,0,0,0.92);
    color: #fff;
    font: 16px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
    overflow: auto;
  }

  /* Always-visible build marker so we can tell, just by looking at the
     screen, whether it's actually running the latest deployed code -- bump
     the string any time this file changes meaningfully. */
  #build-marker {
    position: fixed;
    right: 6px;
    bottom: 6px;
    z-index: 9998;
    color: rgba(255,255,255,0.35);
    font: 11px ui-monospace, monospace;
    pointer-events: none;
  }

  /* Covers the canvas during a preset jump -- see PRESET_TRANSITION_MS
     below for why this exists. Duration must match that constant. */
  #transition-veil {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.26s ease;
  }

<script>
// showError and the global error/unhandledrejection listeners are set up
// in <head>, above the vendored libraries, so failures there surface too.

// Fail loudly and immediately if the vendored decimal.js didn't reach the
// page as a global, instead of dying 300 lines below on Decimal.set().
if (typeof Decimal === 'undefined') {
    throw new Error(
        'decimal.js did not define window.Decimal -- the vendored UMD bundle ' +
        'in <head> exported to a module loader instead of the page.'
    );
}

// Connect to the phone/router BEFORE any WebGL/shader setup below, so a
// rendering failure (bad shader compile, no WebGL2, etc.) can't also take
// the phone connection down with it -- otherwise a display-only bug shows
// up as "disconnected" on the phone with no indication the problem is on
// the wall's side. handleMessage is a function declaration (hoisted), but
// the on-screen state it touches (mode, baseZoom, PRESETS, ...) is declared
// with let/const further down and is therefore in the temporal dead zone
// until this script finishes running. A message that arrives before then
// (mount() can deliver one as soon as it connects) used to throw
// "Cannot access 'mode' before initialization", so messages are queued here
// and flushed at the bottom of the script once that state exists.
let messagingReady = false;
const pendingMessages = [];

const client = new FootronMessaging.Messaging();
client.mount();
client.addMessageListener((message) => {
    if (!messagingReady) {
        pendingMessages.push(message);
        return;
    }
    handleMessage(message);
});

/*
  PERTURBATION-BASED DEEP ZOOM -- summary for future reference:

  Problem this solves: storing the view's pan center as a float (or
  double-single float pair) and accumulating changes to it every frame
  eventually exhausts the ~7-15 significant digits floats carry, so deep
  zooms away from (0,0) degrade.

  Fix: keep the pan center as an ARBITRARY-PRECISION decimal (via decimal.js)
  on the CPU, recomputed fresh every frame -- never accumulated as lossy
  float additions. Each frame, compute one high-precision "reference orbit"
  (the exact iteration path of the pan-center point) in JS, then send only
  that reference + a small "eps" (this pixel's tiny offset from the
  reference) to the GPU. The GPU does cheap float32 math on eps, which
  stays small (and thus precise) regardless of how far from (0,0) you've
  panned.

  Two display modes share this same renderer:
  - "ambient": nobody's controlling it, so it auto-zooms in on the origin
    on a timer, with educational captions (this is what dragonpage_auto.html
    used to do standalone).
  - "interactive": a phone has sent a control message (zoom depth, color
    shift, or jump-to-preset), so pan/zoom targets come from that instead
    (this is what dragonpage_user.html used to do via mouse wheel/drag).
*/

const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2');
if (!gl) throw new Error('WebGL2 not supported in this browser.');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// 120 only resolved boundary detail up to about t=267s of continuous
// ambient auto-zoom (config.json's lifetime is 240s, so there was only
// ~27s of margin before the whole frame flattened to the interior color).
// Raised for headroom; GPU cost scales with this per pixel, but there's
// plenty of room (headless testing showed ~700fps at 120).
const ITER = 170;

// ---------- Shader source ----------

const vertexShaderSrc = `#version 300 es
in vec2 aPosition;
void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

const imageFragSrc = `#version 300 es
precision highp float;
out vec4 fragColor;

#define ITER ${ITER}

uniform vec3 iResolution;
uniform float uZoom;
// The accent end of the palette, rotated in hue by the phone's colour slider
// and computed on the CPU (see accentPalette below) -- the rotation needs a
// gamut search and a band integral, neither of which belongs in a per-pixel
// shader. The gray end is fixed, so these are the only colours that move.
uniform vec3 uAccentLo;      // dark stop of the accent ramp
uniform vec3 uAccentMd;      // mid stop, the most saturated one
uniform vec3 uAccentHi;      // light stop
uniform vec3 uAccentCrest;   // cool end of the specular crest tint
uniform vec3 uAccentAvg;     // one band's average at tone = 1 (antialiasing)
uniform vec3 uDeep;          // far-exterior surround
uniform vec2 uPanX;          // pan center x, as double-single (hi, lo)
uniform vec2 uPanY;          // pan center y, as double-single (hi, lo)
uniform vec2 uRPreX[ITER];   // reference orbit, x, post-rotation/pre-branch (double-single)
uniform vec2 uRPreY[ITER];   // reference orbit, y, post-rotation (double-single)
uniform float uDRef[ITER];   // reference orbit's own branch choice (0 or 1) each iteration

vec2 twoSum(float a, float b) {
    float s = a + b;
    float bb = s - a;
    float err = (a - (s - bb)) + (b - bb);
    return vec2(s, err);
}

vec2 dsAddFloat(vec2 a, float b) {
    vec2 s = twoSum(a.x, b);
    float lo = s.y + a.y;
    return twoSum(s.x, lo);
}

float dsToFloat(vec2 a) { return a.x + a.y; }

// ---- color strategy: "sapphire" (hue-rotatable) ----
// 1. BANDS. Phase = fract(smoothEscape / BAND_PERIOD): a fixed-period sawtooth
//    so bands keep repeating forever as escape counts grow with zoom depth,
//    instead of washing out as smoothEscape/ITER would. Each band STARTS LIGHT
//    at phase 0 and FADES TO DARK by phase 1, then snaps back -- that hard
//    reset next to a bright crest is what gives the ribbed, sculpted look.
// 2. TONE. A much slower cosine over the same escape count carries the palette
//    from neutral silver-gray to saturated sapphire and back. Because escape
//    counts climb steadily as you zoom in, this reads as the whole field
//    morphing gray -> blue -> gray over time, while still showing gray regions
//    and blue regions side by side in a single frame.
// 3. Gray and the accent are never blended as hues (that would swing through
//    green). Each is a 3-stop dark/mid/light ramp, and TONE cross-fades the two
//    ramps stop-for-stop in RGB.
// 4. HUE. The accent's three stops are not one colour at three lightnesses --
//    they run 270 -> 260 -> 238 in OkLCh hue, cooling toward cyan as they
//    lighten, which is what keeps the ramp from looking like flat shaded
//    plastic. The colour slider rotates all three by the same offset, so that
//    32-degree internal spread is carried along intact: gray -> sapphire
//    becomes gray -> pink, gray -> olive, and so on. Those rotated stops
//    arrive as the uAccent* uniforms above.
// Tuned for THIS fractal, not a Mandelbrot: the twindragon's orbit expands
// geometrically, so nearly everything escapes by iteration ~25 no matter how
// deep you zoom. The periods below are therefore small -- a Mandelbrot-scale
// period of 50+ would put the whole screen inside a single band.
const float BAND_PERIOD = 1.5;    // escape counts per light->dark band
const float TONE_PERIOD = 13.5;   // escape counts per gray->blue->gray morph
const float TONE_PHASE  = 0.15;   // start just off pure gray, so shallow
                                  // (low-escape) areas read as pale blue-gray
const float TAU = 6.28318;

// The far exterior escapes almost immediately, so without this it would all sit
// on one band's light edge and bleach the screen white. Fade the first few
// escape counts into deep water instead, which also keeps the dark surround the
// page had before. Rotates with the accent (as uDeep) so a pink palette doesn't
// sit inside a stubbornly blue surround.

// What one band averages out to, integrated over the whole light->dark ramp
// (crest included). The banded colour is linear in tone, so its average is too
// -- these two reproduce the average at any tone exactly, not approximately.
// Used to antialias the bands; see the note in dragonColor. AVG_GRAY is a
// constant because the gray end never moves; the accent's average is
// re-integrated on the CPU whenever the hue rotates and arrives as uAccentAvg.
const vec3 AVG_GRAY = vec3(0.5290, 0.5155, 0.4987);

// Dark / mid / light stops for each end of the tone morph. The gray stops are
// neutral with a faint warm tilt, sampled off the reference render; the accent
// stops arrive already hue-rotated from the CPU, and at slider 0 they are the
// original sapphires (near hue 218, lightening toward sky blue).
vec3 bandPalette(float ramp, float tone) {
    vec3 lo = mix(vec3(0.100, 0.095, 0.090), uAccentLo, tone);
    vec3 md = mix(vec3(0.440, 0.425, 0.410), uAccentMd, tone);
    vec3 hi = mix(vec3(0.870, 0.855, 0.830), uAccentHi, tone);
    float k = ramp * 2.0;
    vec3 c = mix(lo, md, clamp(k, 0.0, 1.0));
    return mix(c, hi, clamp(k - 1.0, 0.0, 1.0));
}

// ---- DIGIT DIVERGENCE, and why the offset is split in two ----
// The map is z -> (1+i)z - d, where the digit d is 0 or 1 depending on which
// side of Re = 0.5 the point lands on. Two points that straddle that threshold
// take DIFFERENT digits, so their orbits separate by exactly 1 -- a real
// discontinuity in the map, not a rounding artifact.
//
// This loop used to keep the pixel's whole offset from the reference orbit in
// one float32 named eps. At a deep zoom eps starts around 1e-18, so the moment
// pixel took a different digit than the reference, eps jumped to ~1 and
// float32's 24-bit mantissa rounded every one of those deep-zoom digits away.
// From that iteration on the pixel was effectively being computed at 1e-7
// resolution, which is what made whole regions go flat and blocky.
//
// The threshold test at iteration i is a straight line in screen space whose
// angle is 90 - 45*(i+1) degrees -- so it is always horizontal, vertical, or
// one of the two diagonals, and the i=0 line is the +45 degree one parallel to
// y = x. That is why the damage shows up as a clean diagonal split.
//

// whole unit -- and repeated multiplication by (1+i) keeps whole units whole.
// The offset is therefore carried as u + c, where c is an exact Gaussian

        // Gaussian integers to Gaussian integers, so c stays exactly whole.

        float upy = ux + uy;
        float cpx = cx - cy;
        float cpy = cx + cy;

        // exactly 1. That whole unit goes into c; u is left alone.

        uy = upy;
        cx = cpx - (dActualF - uDRef[i]);
        cy = cpy;

        // Hand u's own integer part over to c as well. Both subtractions are

        // integer that float32 represents exactly.

    // The bands are contours of log(distance to the twindragon). The map's
    // linear part is multiplication by (1+i), so |z| grows by exactly sqrt(2)
    // per step and |z_n| ~ dist * 2^(n/2); inverting at the escape radius gives

    // contours pack together without limit as you approach the boundary: past
    // ~18 escape counts more than one whole band lands inside a single pixel,
    // the pixel centre samples an essentially arbitrary phase, and the result
    // is TV static. It never resolves by zooming -- the boundary is
    // self-similar, so there is always more of it inside the pixel.
    float pixelSize = uZoom / iResolution.y;
    float bandsPerPixel = pixelSize * exp2(min(0.5 * smoothEscape, 100.0))
                        / (0.6931472 * BAND_PERIOD);

    // Where we are in the slow gray <-> sapphire morph: 0 = silver, 1 = blue.
    // The tone cycle is 9x longer than the band cycle, but it has to fade out
    // almost as early: near the boundary the escape count jumps by TENS between
    // neighbouring pixels, so even a small fraction of a tone cycle per pixel
    // still shows up as speckle. Measured against the smooth-band noise floor,
    // it has to be gone by ~0.12 cycles per pixel.
    //

    // this phase, which meant it slid the whole gray <-> accent morph across

    // Tone is now a pure function of escape count, pinning the morph to zoom

const PAN_CENTER_Y = new Decimal('-0.515');
const PAN_MARGIN = new Decimal('0.4');
const PAN_LIMIT_X = new Decimal('0.665').plus(PAN_MARGIN);   // -> x in [-1.065, 1.065]
const PAN_LIMIT_Y = new Decimal('0.81').plus(PAN_MARGIN);    // -> y in [-1.725, 0.695]

function clampPanAxis(value, center, limit) {
    const lo = center.minus(limit);
    const hi = center.plus(limit);
    if (value.lessThan(lo)) return lo;
    if (value.greaterThan(hi)) return hi;
    return value;
}

// dx/dy arrive from the phone's trackpad as fractions of ONE SCREEN HEIGHT,
// matching the shader's /iResolution.y normalisation -- so a single unit is
// uZoom world units on both axes, and the gesture keeps its on-screen scale
// automatically however deep the zoom is.
//
// Scaled by the CURRENT zoom rather than targetZoom so the drag matches what
// is on the wall right now, and accumulated on the Decimal targets rather
// than on floats: at a deep zoom the step is around 1e-18, which a float pan
// centre could not even represent, let alone add without losing the digits
// the deep zoom depends on.
function applyPan(dx, dy) {
    if (!isFinite(dx) || !isFinite(dy)) return;
    const step = new Decimal(zoom);
    targetPanX = clampPanAxis(targetPanX.plus(step.times(dx)), PAN_CENTER_X, PAN_LIMIT_X);
    targetPanY = clampPanAxis(targetPanY.plus(step.times(dy)), PAN_CENTER_Y, PAN_LIMIT_Y);
}

// ---------- Control messages from the phone ----------

function handleMessage(message) {
    switch (message.type) {
        case 'zoom':
            // value is 0..1 from the phone slider; 0 is baseZoom itself (as
            // zoomed out as the slider goes), 1 is zoomDecades orders of
            // magnitude deeper in, at the current preset/origin.
            enterInteractive();
            applyZoomSlider(message.value);
            break;
        case 'maxzoom':
            // Widens the slider's deep end without moving its shallow end.
            zoomDecades = message.value ? ZOOM_DECADES_MAX : ZOOM_DECADES_NORMAL;
            // Only re-apply while the phone is actually driving. Toggling the
            // range mid-ambient shouldn't seize control of the auto-zoom --
            // and with the slider at 0 there would be nothing to re-apply
            // anyway, since both ranges agree there.
            if (mode === 'interactive') applyZoomSlider(zoomSliderValue);
            break;
        case 'hue':
            // value is 0..1 from the phone slider, one full trip around the
            // color wheel: 0 is the original sapphire, 0.25 lands on pink,
            // and 1 comes back to sapphire. Where the palette sits relative
            // to zoom depth is unaffected -- only the accent's hue moves.
            enterInteractive();
            hueShift = message.value;
            break;
        case 'pan':
            // Relative drag from the phone's trackpad, in screen-height
            // fractions. Panning counts as taking control, so this leaves
            // ambient mode -- otherwise the render loop would pin the centre
            // back to the origin on the very next frame.
            enterInteractive();
            applyPan(message.dx, message.dy);
            break;
        case 'preset':
            enterInteractive();
            applyPreset(message.value);
            break;
        case 'resume':
            enterAmbient();
            break;
        default:
            console.warn('Unrecognized message type', message.type);
    }
}

window.messageHandler = handleMessage; // purely for local testing

// ---------- Render loop ----------

function render() {
    if (mode === 'ambient') {
        const t = (performance.now() - ambientStartTime) / 1000.0;
        updateCaptions(t);
        // Direct assignment (no smoothing): a continuous, ever-deepening
        // zoom recomputed fresh every frame, same as the old auto page.
        zoom = targetZoom = baseZoom * Math.pow(1.3, -t * 0.6);
        panX = targetPanX = new Decimal(0);
        panY = targetPanY = new Decimal(0);
    } else {
        // Eased transitions toward whatever the phone last requested (slider
        // move or preset jump), same easing the old mouse-driven page used.
        const smooth = 0.06;
        panX = panX.plus(targetPanX.minus(panX).times(smooth));
        panY = panY.plus(targetPanY.minus(panY).times(smooth));
        zoom = Math.exp(Math.log(zoom) + (Math.log(targetZoom) - Math.log(zoom)) * smooth);
    }

    // Recompute the reference orbit fresh, every frame, from the current
    // (arbitrary-precision) pan center.
    const orbit = computeReferenceOrbit(panX, panY);

    const rPreXFlat = new Float32Array(ITER * 2);
    const rPreYFlat = new Float32Array(ITER * 2);
    const dRefFlat = new Float32Array(ITER);
    for (let i = 0; i < ITER; i++) {
        const [hx, lx] = decimalToDoubleSingle(orbit.preX[i]);
        rPreXFlat[i * 2] = hx; rPreXFlat[i * 2 + 1] = lx;
        const [hy, ly] = decimalToDoubleSingle(orbit.preY[i]);
        rPreYFlat[i * 2] = hy; rPreYFlat[i * 2 + 1] = ly;
        dRefFlat[i] = orbit.dRef[i];
    }

    const [panXhi, panXlo] = decimalToDoubleSingle(panX);
    const [panYhi, panYlo] = decimalToDoubleSingle(panY);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(imageProgram);

    gl.uniform3f(uResLoc, canvas.width, canvas.height, 1.0);
    gl.uniform1f(uZoomLoc, zoom);
    updateAccent(hueShift);
    gl.uniform3fv(uAccentLoLoc, accent.lo);
    gl.uniform3fv(uAccentMdLoc, accent.md);
    gl.uniform3fv(uAccentHiLoc, accent.hi);
    gl.uniform3fv(uAccentCrestLoc, accent.crest);
    gl.uniform3fv(uAccentAvgLoc, accent.avg);
    gl.uniform3fv(uDeepLoc, accent.deep);
    gl.uniform2f(uPanXLoc, panXhi, panXlo);
    gl.uniform2f(uPanYLoc, panYhi, panYlo);
    gl.uniform2fv(uRPreXLoc, rPreXFlat);
    gl.uniform2fv(uRPreYLoc, rPreYFlat);
    gl.uniform1fv(uDRefLoc, dRefFlat);

    gl.drawArrays(gl.TRIANGLES, 0, 6);

    requestAnimationFrame(render);
}

requestAnimationFrame(render);

// All the state handleMessage touches now exists, so it's safe to run
// anything that arrived while the script was still initializing.
messagingReady = true;
for (const message of pendingMessages) {
    handleMessage(message);
}
pendingMessages.length = 0;
</script>
