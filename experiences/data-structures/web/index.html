<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Ways to Remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<!-- The phone connection. Loaded in <head> so FootronMessaging exists by the
     time the director at the bottom of the page runs. -->
<script src="./footron-messaging.development.js"></script>

<style>
:root{
  /* Global chrome scale. Every length outside the canvas is written as
     calc(<n>px * var(--k)), so this one number is the whole typography pass.
     It has to stay unitless: a vw-based clamp() here would be a number/length
     mix inside every one of those calcs, which is invalid at computed-value
     time and drops the layout on the floor.

     The scene needs no equivalent -- it is authored in a fixed 1000x640 world
     and contain-fitted, so everything inside it already scales. */
  --k:0.72;

  /* The canvas-side twins of these live in T at the top of draw.js and have to
     move with them: the canvas sits inside .viz, so a --viz that has drifted
     from T.ink shows up as a visible rectangle. */
  --ink:#0B0F1C;
  --viz:#0B0F1C;
  --panel:#141A2C;
  --panel-2:#171E33;
  --line:#28324E;
  --line-soft:#1E2740;
  --text:#E9EDFB;
  --muted:#8E9BC2;
  --dim:#5B678C;

  --r:calc(14px*var(--k));
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;

  /* Set by the director to whichever scene is playing, so the rail, the
     contents list and the progress bar all recolour together. */
  --accent:#F5B54C;
}
@media (min-width:1500px){ :root{--k:1} }
@media (min-width:2300px){ :root{--k:1.22} }
@media (min-width:3100px){ :root{--k:1.38} }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background:
    radial-gradient(calc(1100px*var(--k)) calc(700px*var(--k)) at 82% -10%, #17203A 0%, transparent 60%),
    radial-gradient(calc(900px*var(--k)) calc(650px*var(--k)) at 6% 110%, #141B31 0%, transparent 58%),
    var(--ink);
  color:var(--text);
  font-family:var(--f-body);
  font-size:calc(15px*var(--k));
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  cursor:none;                       /* nothing on the wall is clickable */
}

.stage{
  height:100vh; height:100dvh;
  display:grid; gap:calc(14px*var(--k)); padding:calc(14px*var(--k));
  grid-template-columns:calc(300px*var(--k)) minmax(0,1fr) calc(330px*var(--k));
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"left viz right";
}

.card{
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:calc(15px*var(--k)) calc(17px*var(--k));
  min-height:0;
}
.card h2{
  margin:0 0 calc(11px*var(--k));
  font-family:var(--f-mono); font-size:calc(10.5px*var(--k)); font-weight:600;
  letter-spacing:.17em; text-transform:uppercase; color:var(--dim);
  display:flex; align-items:baseline; gap:calc(9px*var(--k));
}
.card h2::after{content:""; flex:1; height:1px; background:var(--line-soft)}

/* ------------------------------------------------------------------ left */
.mark{grid-area:left; display:flex; flex-direction:column; gap:calc(14px*var(--k)); min-height:0}
.title{padding:calc(6px*var(--k)) calc(4px*var(--k)) 0}
.title h1{
  margin:0; font-size:calc(40px*var(--k)); line-height:1.02; font-weight:700;
  letter-spacing:-.02em; text-wrap:balance;
}
.title p{
  margin:calc(10px*var(--k)) 0 0; font-size:calc(13.5px*var(--k));
  color:var(--muted); line-height:1.45; text-wrap:pretty;
}

/* The contents list. It is the only thing telling a visitor who walks up
   mid-cycle that there are four of these and which one they are watching. */
.toc{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:calc(7px*var(--k))}
.toc li{
  position:relative; overflow:hidden;
  border:1px solid var(--line-soft); border-radius:calc(10px*var(--k));
  padding:calc(10px*var(--k)) calc(12px*var(--k));
  background:rgba(255,255,255,.012);
  transition:border-color .4s, background .4s;
}
.toc .n{
  font-family:var(--f-mono); font-size:calc(10px*var(--k)); color:var(--dim);
  letter-spacing:.14em;
}
.toc .nm{
  display:block; font-size:calc(16px*var(--k)); font-weight:600; color:var(--muted);
  margin-top:calc(2px*var(--k)); transition:color .4s;
}
.toc .q{
  display:block; font-size:calc(12.5px*var(--k)); color:var(--dim); margin-top:calc(2px*var(--k));
}
.toc li.live{
  border-color:color-mix(in srgb, var(--accent) 55%, transparent);
  background:color-mix(in srgb, var(--accent) 9%, transparent);
}
.toc li.live .nm{color:var(--accent)}
.toc li.live .n{color:color-mix(in srgb, var(--accent) 75%, transparent)}
/* The bar across the bottom of the live entry is how far through that scene
   the script is -- it doubles as the "something is still coming" signal. */
.toc .bar{
  position:absolute; left:0; bottom:0; height:calc(2.5px*var(--k)); width:0%;
  background:var(--accent); opacity:0; transition:opacity .3s;
}
.toc li.live .bar{opacity:.9}

/* ------------------------------------------------------------------- viz */
.viz{
  grid-area:viz; position:relative; min-height:0;
  border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:var(--viz);
  display:flex; flex-direction:column;
}
#scene{flex:1; width:100%; min-height:0; display:block}

/* ------------------------------------------------------------------ rail */
.rail{grid-area:right; display:flex; flex-direction:column; gap:calc(14px*var(--k)); min-height:0; overflow:hidden}

.caption p{
  margin:0; font-size:calc(19px*var(--k)); line-height:1.4; color:var(--text);
  text-wrap:pretty;
  min-height:calc(6 * 1.4em);        /* hold six lines so the cards below never jump */
  transition:opacity .28s;
}
.caption p.swap{opacity:0}
.caption b{font-weight:700; color:var(--accent)}
.caption i{font-style:italic; color:var(--muted)}

.cost{width:100%; border-collapse:collapse; font-family:var(--f-mono)}
.cost th{
  text-align:left; font-weight:500; font-size:calc(9.5px*var(--k)); letter-spacing:.13em;
  text-transform:uppercase; color:var(--dim);
  padding:0 0 calc(7px*var(--k)); border-bottom:1px solid var(--line-soft);
}
.cost th:last-child{text-align:right}
.cost td{
  padding:calc(8px*var(--k)) 0; border-bottom:1px solid var(--line-soft);
  color:var(--muted); font-size:calc(12px*var(--k)); vertical-align:top;
}
.cost tr:last-child td{border-bottom:0}
.cost .op{
  color:var(--text); font-family:var(--f-body); font-weight:600; font-size:calc(13.5px*var(--k));
}
.cost .note{display:block; font-family:var(--f-body); font-size:calc(11.5px*var(--k)); color:var(--dim); margin-top:calc(1px*var(--k))}
.cost .big{
  text-align:right; font-size:calc(15px*var(--k)); font-weight:600; color:var(--muted);
  white-space:nowrap;
}
/* The row the scene is currently demonstrating. */
.cost tr.live .op,
.cost tr.live .big{color:var(--accent)}
.cost tr.live .big{text-shadow:0 0 calc(14px*var(--k)) color-mix(in srgb, var(--accent) 45%, transparent)}

.uses p{margin:0; font-size:calc(13.5px*var(--k)); color:var(--muted); line-height:1.5; text-wrap:pretty}
.uses em{font-style:normal; color:var(--text); font-weight:500}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* Narrow screens are for previewing on a laptop, not for the wall. Keep the
   scene and the narration; drop everything that is only orientation. */
@media (max-width:1100px){
  .stage{grid-template-columns:calc(250px*var(--k)) minmax(0,1fr) calc(280px*var(--k))}
}
@media (max-width:820px){
  .stage{
    grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"viz" "right";
  }
  .mark{display:none}
  .rail .card:not(.caption){display:none}
  .caption p{min-height:0; font-size:calc(17px*var(--k))}
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }

/* No devtools on the kiosk, so a script error has to say so on the wall. */
#error{
  display:none; position:fixed; inset:auto 0 0 0; z-index:9;
  background:#7A1D10; color:#FFE9E2;
  font:13px/1.5 ui-monospace,Consolas,monospace;
  padding:12px 16px; white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="stage">

  <div class="mark">
    <div class="title">
      <h1>Four Ways<br>to Remember</h1>
      <p>Four data structures that rarely come up in a first course — and the
         one question each of them is built to answer quickly.</p>
    </div>
    <ol class="toc" id="toc"></ol>
  </div>

  <main class="viz">
    <canvas id="scene"></canvas>
    <p class="sr" aria-live="polite" id="live-region"></p>
  </main>

  <aside class="rail">
    <section class="card caption">
      <h2>Right now</h2>
      <p id="caption-text">Starting up&hellip;</p>
    </section>

    <section class="card">
      <h2>What it costs</h2>
      <table class="cost">
        <thead><tr><th>Operation</th><th>Cost</th></tr></thead>
        <tbody id="cost-body"></tbody>
      </table>
    </section>

    <section class="card uses">
      <h2>Where you'll meet it</h2>
      <p id="uses-text"></p>
    </section>
  </aside>

</div>

<div id="error"></div>

<script>
function showError(message){
  console.error(message);
  var el = document.getElementById('error');
  el.textContent = String(message);
  el.style.display = 'block';
}
window.addEventListener('error', function(e){
  showError((e.error && e.error.stack) || e.message || String(e));
});
</script>

<script src="./draw.js"></script>
<script src="./bloom.js"></script>
<script src="./skiplist.js"></script>
<script src="./unionfind.js"></script>
<script src="./cuckoo.js"></script>

<script>
(function(){
"use strict";

/* ---------------- phone connection ----------------
 *
 * Mounted before anything below touches the canvas, so that if the director
 * throws while setting itself up the phone still connects -- otherwise a
 * display bug shows up on the phone as "disconnected", with nothing to say
 * which side the problem is on.
 *
 * handleMessage is a hoisted function declaration, but the state it drives
 * does not exist until start() runs at the bottom of this file, and mount()
 * can deliver a message the moment it connects. So anything arriving early is
 * queued here and flushed there.
 */
var messagingReady = false;
var pendingMessages = [];
var client = new FootronMessaging.Messaging();
client.mount();
client.addMessageListener(function(message){
  if (!messagingReady){ pendingMessages.push(message); return; }
  handleMessage(message);
});

/* ---------------- constants ---------------- */
var W = 1000, H = 640;               /* the world every scene is drawn in    */
var HOLD = 2.2;                      /* pause on a finished scene, seconds   */
var FADE = 0.5;                      /* cross-fade between scenes, seconds   */
var MIN_SPEED = 0.6, MAX_SPEED = 2.0;

var scenes = window.Scenes || [];
if (!scenes.length) showError("No scenes loaded — check that draw.js and the four scene files were served.");

/* ---------------- dom ---------------- */
var canvas = document.getElementById("scene");
var ctx = canvas.getContext("2d");
var captionEl = document.getElementById("caption-text");
var costBody = document.getElementById("cost-body");
var usesEl = document.getElementById("uses-text");
var tocEl = document.getElementById("toc");
var liveEl = document.getElementById("live-region");

var dpr = Math.min(window.devicePixelRatio || 1, 2);
var view = { s: 1, ox: 0, oy: 0, w: 0, h: 0 };

/* ---------------- state ---------------- */
var S = {
  i: 0,                  /* which scene is on the wall                      */
  speed: 1,
  paused: false,
  locked: false,         /* the phone picked a scene: stay on it            */
  hold: 0,               /* time spent sitting on a finished scene          */
  fade: 1,               /* 0..1, the cross-fade                            */
  phase: "in",           /* in | play | out                                 */
  seed: (Date.now() ^ 0x5f3a) >>> 0
};

function scene(){ return scenes[S.i]; }

/* ---------------- fitting ----------------
 *
 * The scene is authored in a fixed 1000x640 world and contain-fitted into
 * whatever box .viz turns out to be, so no scene ever asks how big the wall
 * is. On any box that is not 25:16 the leftover is a margin of backdrop, which
 * is painted the same colour as the world so the seam does not show.
 */
function fit(){
  var box = canvas.getBoundingClientRect();
  var w = Math.max(1, box.width), h = Math.max(1, box.height);
  view.w = w; view.h = h;
  view.s = Math.min(w / W, h / H);
  view.ox = (w - W * view.s) / 2;
  view.oy = (h - H * view.s) / 2;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

function render(){
  var sc = scene();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = D.T.ink;
  ctx.fillRect(0, 0, view.w, view.h);
  if (!sc) return;
  ctx.save();
  ctx.globalAlpha = S.fade;
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);
  /* Clip to the world so a scene cannot paint into the letterbox margin. */
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  try { sc.draw(ctx); }
  catch (e){ showError("Scene '" + sc.id + "' failed to draw:\n" + ((e && e.stack) || e)); }
  ctx.restore();
}

/* ---------------- the rail ---------------- */

/* Built once per scene rather than per frame: the rows only change when the
   scene does, and rebuilding a table every frame would throw away the CSS
   transition that makes the live row light up. */
function dressRail(){
  var sc = scene();
  if (!sc) return;
  document.documentElement.style.setProperty("--accent", sc.accent);

  costBody.innerHTML = "";
  sc.cost.forEach(function(row){
    var tr = document.createElement("tr");
    tr.dataset.key = row.key;
    tr.innerHTML =
      '<td><span class="op"></span><span class="note"></span></td>' +
      '<td class="big"></td>';
    tr.querySelector(".op").textContent = row.op;
    tr.querySelector(".note").textContent = row.note;
    tr.querySelector(".big").textContent = row.big;
    costBody.appendChild(tr);
  });

  /* The scene files are the only source of these strings and they carry a
     little markup on purpose (<b>, <em>, <i>), so this is innerHTML. Nothing
     from the phone or from anywhere else ever reaches it. */
  usesEl.innerHTML = sc.uses;

  var items = tocEl.children;
  for (var i = 0; i < items.length; i++){
    items[i].classList.toggle("live", i === S.i);
  }
}

function buildToc(){
  tocEl.innerHTML = "";
  scenes.forEach(function(sc, i){
    var li = document.createElement("li");
    li.innerHTML =
      '<span class="n"></span><span class="nm"></span><span class="q"></span>' +
      '<span class="bar"></span>';
    li.querySelector(".n").textContent = "0" + (i + 1);
    li.querySelector(".nm").textContent = sc.name;
    li.querySelector(".q").textContent = sc.question;
    tocEl.appendChild(li);
  });
}

/* The caption is swapped on a short fade rather than replaced outright: on a
   wall, text that changes instantly under your eye reads as a glitch. */
var shownCaption = null;
var captionTimer = null;
function syncCaption(force){
  var sc = scene();
  if (!sc || !sc.beats) return;
  var cap = sc.beats.cap;
  if (cap === shownCaption && !force) return;
  shownCaption = cap;
  if (force){
    /* Seeking, so there is nothing to fade from. */
    clearTimeout(captionTimer);
    captionEl.classList.remove("swap");
    captionEl.innerHTML = cap || "";
    liveEl.textContent = captionEl.textContent;
    return;
  }
  captionEl.classList.add("swap");
  clearTimeout(captionTimer);
  captionTimer = setTimeout(function(){
    captionEl.innerHTML = cap || "";
    captionEl.classList.remove("swap");
    /* Screen readers get the plain text, without the emphasis markup. */
    liveEl.textContent = captionEl.textContent;
  }, 170);
}

var shownHot = null;
function syncCost(){
  var sc = scene();
  if (!sc || !sc.beats) return;
  var hot = sc.beats.hot;
  if (hot === shownHot) return;
  shownHot = hot;
  var rows = costBody.children;
  for (var i = 0; i < rows.length; i++){
    rows[i].classList.toggle("live", rows[i].dataset.key === hot);
  }
}

function syncProgress(){
  var sc = scene();
  if (!sc || !sc.beats) return;
  var bar = tocEl.children[S.i] && tocEl.children[S.i].querySelector(".bar");
  if (bar) bar.style.width = (sc.beats.progress() * 100).toFixed(1) + "%";
}

/* ---------------- the director ---------------- */

function load(i, newSeed){
  S.i = ((i % scenes.length) + scenes.length) % scenes.length;
  if (newSeed) S.seed = (S.seed * 1664525 + 1013904223) >>> 0;
  var sc = scene();
  try { sc.reset(S.seed + S.i * 7919); }
  catch (e){ showError("Scene '" + sc.id + "' failed to start:\n" + ((e && e.stack) || e)); }
  S.hold = 0;
  shownCaption = null; shownHot = null;
  dressRail();
  /* Set outright rather than cross-faded: a scene is only ever loaded while
     the canvas is faded out, so there is nothing on screen to fade from. */
  syncCaption(true);
  syncCost();
  syncProgress();
}

function goTo(i, newSeed){
  if (S.phase === "out") return;      /* already on the way somewhere        */
  S.pending = { i: i, newSeed: newSeed };
  S.phase = "out";
}

function advance(){ goTo(S.i + 1, true); }

function update(dt){
  var sc = scene();
  if (!sc) return;

  if (S.phase === "out"){
    S.fade -= dt / FADE;
    if (S.fade <= 0){
      S.fade = 0;
      load(S.pending.i, S.pending.newSeed);
      S.pending = null;
      S.phase = "in";
    }
    return;
  }
  if (S.phase === "in"){
    S.fade += dt / FADE;
    if (S.fade >= 1){ S.fade = 1; S.phase = "play"; }
  }

  if (S.paused) return;

  try { sc.step(dt * S.speed); }
  catch (e){ showError("Scene '" + sc.id + "' failed while running:\n" + ((e && e.stack) || e)); return; }

  syncCaption();
  syncCost();
  syncProgress();

  if (sc.beats && sc.beats.done){
    S.hold += dt;
    if (S.hold > HOLD){
      /* Locked by the phone means stay here: replay this one with fresh data
         rather than moving on, so whoever picked it keeps watching it. */
      if (S.locked) goTo(S.i, true);
      else advance();
    }
  }
}

var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  /* Clamped, because a tab that was backgrounded comes back with a huge dt and
     would otherwise skip a scene forward in a single step. */
  var dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  update(dt);
  render();
}

/* ---------------- controls from the phone ----------------
 *
 * The message names below are exactly the ones the panel in
 * experiences/data-structures/controls/lib/index.js sends. Nothing is ever
 * sent back the other way -- the wall only adds a listener -- so the panel
 * owns its own copy of the state and seeds it from the same defaults.
 *
 * The one thing the wall does move on its own is which scene is playing, and
 * that is exactly why picking one sets `locked`: without it, a visitor who
 * chose the skip list would watch the wall roll on to union-find forty seconds
 * later and reasonably conclude the button had not worked.
 */
function handleMessage(message){
  if (!message || typeof message !== "object") return;
  switch (message.type){
    case "show":
      var at = -1;
      for (var i = 0; i < scenes.length; i++) if (scenes[i].id === message.value) at = i;
      if (at < 0){ console.warn("Unknown scene", message.value); break; }
      S.locked = true;
      S.paused = false;
      /* Re-picking the scene already on the wall restarts it, which is what
         the button looks like it should do. */
      goTo(at, at !== S.i);
      break;

    case "speed":
      S.speed = D.clamp(Number(message.value) || 1, MIN_SPEED, MAX_SPEED);
      break;

    case "pause":
      S.paused = message.value === undefined ? !S.paused : !!message.value;
      break;

    case "shuffle":
      /* New data for the scene on the wall, from the top. */
      S.paused = false;
      goTo(S.i, true);
      break;

    case "resume":
      /* Nobody is driving any more: back to the defaults and on with the
         cycle, which is how the wall should look when it is left alone.
         Clearing the pause matters most -- a scene left frozen stays frozen
         for whoever walks up next. */
      S.locked = false;
      S.paused = false;
      S.speed = 1;
      advance();
      break;

    default:
      console.warn("Unrecognized message type", message.type);
  }
}

window.messageHandler = handleMessage;   /* purely for local testing */

/* Authoring keys. The wall has no keyboard; these are for working on the page.
   1-4 jump to a scene, space pauses, N moves on, R re-rolls the data. */
document.addEventListener("keydown", function(e){
  if (e.key >= "1" && e.key <= String(Math.min(9, scenes.length))){
    S.locked = true; goTo(Number(e.key) - 1, true);
  } else if (e.code === "Space"){ e.preventDefault(); S.paused = !S.paused; }
  else if (e.key === "n" || e.key === "N"){ S.locked = false; advance(); }
  else if (e.key === "r" || e.key === "R"){ goTo(S.i, true); }
});

/* ---------------- start ---------------- */

/* The fonts have to be in before the first frame is measured: every scene sets
   text in IBM Plex Mono and centres things on measureText, and a layout
   measured while Consolas is standing in is a layout that is wrong for the
   life of that scene. */
function fontsIn(){
  if (!document.fonts) return Promise.resolve();
  return Promise.all([
    document.fonts.load("500 14px \"IBM Plex Mono\""),
    document.fonts.load("600 14px \"IBM Plex Mono\""),
    document.fonts.load("700 14px \"IBM Plex Mono\""),
    document.fonts.load("400 14px \"Inter\""),
    document.fonts.load("600 14px \"Inter\"")
  ]).catch(function(){ /* offline kiosk: fall back and carry on */ })
    .then(function(){ return document.fonts.ready; });
}

/*
 * Authoring query parameters. The wall loads the bare URL, so all of this is
 * inert in production -- it exists so a scene can be worked on without sitting
 * through the cycle to reach it, and so a given moment can be looked at over
 * and over without waiting for it to come round.
 *
 *   ?scene=cuckoo   open on that scene and stay on it
 *   ?t=12.5         fast-forward that many seconds into it before drawing
 *   ?seed=42        fix the data instead of taking it from the clock
 *   ?hold=1         freeze once there
 *   ?speed=2        run at a different rate
 */
function applyParams(){
  var p = new URLSearchParams(location.search);
  var at = 0;

  var seed = p.get("seed");
  if (seed !== null && seed !== "") S.seed = (parseInt(seed, 10) || 0) >>> 0;

  var want = p.get("scene");
  if (want){
    for (var i = 0; i < scenes.length; i++) if (scenes[i].id === want) at = i;
    S.locked = true;
  }

  var speed = parseFloat(p.get("speed"));
  if (isFinite(speed)) S.speed = D.clamp(speed, MIN_SPEED, MAX_SPEED);

  load(at, false);

  /* Seeking is done by stepping the scene at a fixed rate rather than by
     jumping a clock, because a beat's enter/exit hooks are what actually move
     the structure -- skipping them would land on a drawn frame whose data
     never happened. */
  var seek = parseFloat(p.get("t"));
  if (isFinite(seek) && seek > 0){
    var sc = scene(), acc = 0, dt = 1 / 60, guard = 0;
    while (acc < seek && !sc.beats.done && guard++ < 60 * 600){
      sc.step(dt); acc += dt;
    }
    syncCaption(true); syncCost(); syncProgress();
  }

  if (p.get("hold")) S.paused = true;

  /* A seeked page should show what was asked for, not fade up to it. */
  if (p.has("t") || p.has("hold")){ S.fade = 1; S.phase = "play"; }
}

function start(){
  buildToc();
  fit();
  S.fade = 0; S.phase = "in";
  applyParams();

  /* Watch the canvas rather than the window: the viewport a browser reports in
     its first frames is not always the one it settles on, and a fit measured
     against that early value would otherwise stay wrong. */
  if (window.ResizeObserver){
    new ResizeObserver(function(){ fit(); }).observe(canvas);
  } else {
    window.addEventListener("resize", fit);
  }
  /* A face landing late changes every measureText in the scene. */
  if (document.fonts) document.fonts.addEventListener("loadingdone", fit);

  requestAnimationFrame(frame);

  /* Everything handleMessage touches now exists, so it is safe to run anything
     that arrived from the phone while this script was still starting up. */
  messagingReady = true;
  for (var i = 0; i < pendingMessages.length; i++) handleMessage(pendingMessages[i]);
}

fontsIn().then(start).catch(function(e){ showError(e); start(); });

})();
</script>
