<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes</title>

<!-- Display fonts. Special Elite is the typewriter face; Caveat is the
     handwriting used for the attribution, so the marginalia and the rough.js
     doodles read as the same pen. Both name real fallbacks after them, because
     the kiosk is not guaranteed to reach fonts.googleapis.com and a missing
     webfont has to degrade to a readable page rather than to nothing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;600&family=WindSong:wght@400;500&display=swap">

<style>
  :root {
    --paper:     #f4ece0;
    --paper-dim: #e7dbc9;
    --ink:       #2f2419;
    --ink-soft:  #9a8872;   /* marginalia, caret, attribution */

    /* The two pens. Both are re-rolled per verse from PALETTES below, so these
       are only what the page opens with before the first verse is dealt. */
    --accent:      #e352bc;              /* doodles, shimmer, lit words   */
    --accent-deep: #a81f96;              /* the same pen pressed harder   */
    --glow-near:   rgba(227,82,188,.75); /* the lamp under a glowing word */
    --glow-far:    rgba(227,82,188,.32);
    --marker:      #f6d976;              /* highlighter                   */

    /* One size rules the page. Everything else is a ratio of it, so the whole
       quote scales with the wall in one move. */
    --f-quote: clamp(26px, 3.45vw, 78px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Special Elite", "Courier New", Courier, monospace;
    -webkit-font-smoothing: antialiased;
    cursor: none;              /* nothing on the wall is clickable */
  }

  /* Paper: a warm vignette plus a faint fibre speckle, so the field behind the
     type is not a flat block of colour under the projector. */
  #paper {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(130% 110% at 50% 50%, rgba(0,0,0,0) 45%, rgba(74,54,32,.16) 100%),
      repeating-linear-gradient(115deg, rgba(120,95,60,.035) 0 2px, rgba(0,0,0,0) 2px 6px),
      var(--paper);
  }

  /* The doodle overlay sits above the paper and under nothing -- the marks are
     allowed to cross the type, which is what makes them read as annotations. */
  #doodles { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .doodle { opacity: .95; }
  .doodle-ambient { opacity: .5; }

  /* ---------------------------------------------------------------- stage */
  /* A column down the middle of the wall: half of it wide, all of it tall.
     The height has to come from the viewport and not from the text -- a stage
     left to take its height from its contents is measured by fit() as whatever
     the previous size happened to leave behind, so every re-fit shrinks the
     type again and the quote ratchets down to the floor size. */
  #stage {
    position: fixed;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    z-index: 2;
    display: flex; align-items: center; justify-content: center;
    padding: 6vh 9vw;
  }
  #quote {
    font-size: var(--f-quote);     /* the starting point; fit() scales from it */
    line-height: 1.62;
    text-align: left;
    transition: opacity 900ms ease;
  }
  #quote.out { opacity: 0; }

  /* One line in the file is one line on the wall: white-space:pre keeps the
     spacing exactly as written and refuses to wrap, and quote.js sizes the type
     so that it fits. A quote too long to fit even at the floor size gets
     .wrapping and is allowed to break after all. */
  .line { white-space: pre; }
  #quote.wrapping .line { white-space: pre-wrap; }
  .line.gap { height: .7em; }

  /* Each letter is its own inline-block, and a line may be broken between any
     two of them -- so a wrapped quote would otherwise split words down the
     middle. quote.js puts the letters of a word inside one of these, leaving
     the spaces between words as the only places a line can break. */
  .word { white-space: nowrap; }

  .attribution {
    margin-top: .85em;
    font-family: "Caveat", "Special Elite", cursive;
    font-size: .68em;
    color: var(--ink-soft);
    letter-spacing: .01em;
  }
  .attrib-dash { color: var(--ink-soft); }

  /* ------------------------------------------------------------ the type */
  /* Every character is in the DOM from the start and only opacity is flipped,
     so the line breaks never move while the quote is being typed. */
  .ch {
    display: inline-block;
    opacity: 0;
    /* The per-character tilt is set inline at build time; this transition is
       only the ink landing. */
    transition: opacity 90ms linear;
  }
  .ch.sp { display: inline; }        /* keep the line-break opportunity */
  .ch.on { opacity: 1; }

  .seg { position: relative; }
  .seg.nowrap { white-space: nowrap; }

  /* The caret is one element that jumps to the last character typed, rather
     than a character of its own -- it never disturbs the layout. */
  #caret {
    position: fixed; top: 0; left: 0; z-index: 4;
    background: var(--ink-soft);   /* width and height come from the character */
    opacity: 0;
    border-radius: 1px;
  }
  #caret.lit { opacity: .55; animation: blink 900ms steps(1, end) infinite; }
  @keyframes blink { 0%, 55% { opacity: .55; } 56%, 100% { opacity: 0; } }

  /* =======================================================================
     EFFECTS -- the CSS half
     Every class below is reachable from a quote file by its bare name:
     `[like this](glow)`. Add a `.fx-<name>` rule here and it is immediately
     usable. They all key off `.on`, which quote.js adds the instant the marked
     run has finished typing.
     ===================================================================== */

  /* glow -- a warm lamp under the word, breathing. */
  .fx-glow.on {
    color: var(--accent-deep);
    animation: glow 2.6s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 0 rgba(0,0,0,0); }
    50%      { text-shadow: 0 0 .5em var(--glow-near), 0 0 1.1em var(--glow-far); }
  }

  /* swell -- the word arrives a size too big and settles back. It has to settle
     all the way back: a transform does not reflow the line, so a run left
     standing at 1.07 overprints the words either side of it. */
  .fx-swell { display: inline-block; transform-origin: 50% 85%; }
  .fx-swell.on { animation: swell 900ms cubic-bezier(.22,1.3,.36,1) both; }
  @keyframes swell {
    0%   { transform: scale(1); }
    38%  { transform: scale(1.22) rotate(-1.5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* wobble -- a slow, permanent shimmy. Use it sparingly. */
  .fx-wobble { display: inline-block; transform-origin: 50% 90%; }
  .fx-wobble.on { animation: wobble 2.2s ease-in-out infinite; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%      { transform: rotate(2deg) translateY(-.04em); }
  }

  /* shimmer -- a band of light sweeping through the letterforms.
     The characters have to go back to plain inline for this one: the gradient
     is painted on the run and clipped to the text inside it, and an
     inline-block character is its own box rather than text the clip can reach.
     Going inline also makes the per-character tilt inert, which is the price
     of the effect. */
  .fx-shimmer .ch { display: inline; }
  .fx-shimmer.on {
    background-image: linear-gradient(100deg,
      var(--ink) 0%, var(--ink) 38%,
      var(--accent) 48%, var(--accent-deep) 53%, var(--accent) 58%,
      var(--ink) 68%, var(--ink) 100%);
    background-size: 280% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 3.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 130% 0; }
    100% { background-position: -30% 0; }
  }

  /* script -- the word written out by hand in WindSong instead of typed.
     The letters drop back to plain inline so the script joins up rather than
     standing as a row of separately tilted inline-blocks, and the line-height
     is pinned so the taller face does not push its line open. */
  .fx-script, .fx-windsong {
    font-family: "WindSong", "Caveat", cursive;
    /* WindSong sets a very small x-height for its em, so it has to be set
       roughly twice the size of the typewriter face to read as the same size,
       and its line-height pinned back down so the tall loops do not push the
       line it sits in open. */
    font-size: 2.1em;
    font-weight: 500;
    line-height: .62;
    letter-spacing: .01em;
    padding: 0 .16em;   /* the swashes need room either side */
  }
  .fx-script .ch, .fx-windsong .ch { display: inline; }

  /* highlight -- a marker pen swiped behind the word, drawn on left to right
     and left sitting there. The band is rotated a touch so the ends do not
     line up with the baseline. */
  .fx-highlight { position: relative; }
  .fx-highlight::before {
    content: "";
    position: absolute;
    left: -.18em; right: -.18em; top: .08em; bottom: -.02em;
    background: var(--marker);
    border-radius: .35em .5em .4em .45em;
    transform: rotate(-.7deg) scaleX(0);
    transform-origin: left center;
    z-index: -1;
    opacity: .85;
  }
  .fx-highlight.on::before {
    animation: swipe 520ms cubic-bezier(.3,.9,.4,1) both;
  }
  @keyframes swipe {
    0%   { transform: rotate(-.7deg) scaleX(0); }
    100% { transform: rotate(-.7deg) scaleX(1); }
  }

  /* ------------------------------------------------------------- failures */
  /* No devtools on the kiosk, so a script error has to say so on the wall. */
  #error {
    display: none;
    position: fixed; inset: auto 0 0 0; z-index: 9;
    background: #7a1d10; color: #ffe9e2;
    font: 14px/1.5 ui-monospace, Consolas, monospace;
    padding: 12px 16px; white-space: pre-wrap;
  }
</style>
</head>

<body>
  <div id="paper"></div>
  <div id="stage"><div id="quote"></div></div>
  <svg id="doodles" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="caret"></div>
  <div id="error"></div>

<script>
function showError(message) {
    console.error(message);
    var el = document.getElementById('error');
    el.textContent = String(message);
    el.style.display = 'block';
}
window.addEventListener('error', function (e) {
    showError((e.error && e.error.stack) || e.message || String(e));
});
</script>

<script src="./rough.js"></script>
<script src="./doodles.js"></script>
<script src="./quote.js"></script>

<script>
(function () {
    'use strict';

    /* The rotation is every scripture<n>.txt sitting next to this page. Drop a
       scripture31.txt in and it joins on the next load -- nothing to register.
       They are probed a block at a time rather than one at a time, so a hole in
       the numbering does not cut the rotation short: only a whole empty block
       ends the search. */
    var MAX_FILES = 200;
    var PROBE_BLOCK = 10;
    var HOLD_MS = 7000;        /* how long a finished quote sits before the next */

    /* Shown when the files cannot be fetched at all, which is what happens if
       this page is opened straight off disk (file://) instead of over http. */
    var FALLBACK = [
        '“Wherefore, my beloved brethren, [pray](glow) unto the Father',
        'with all the [energy of heart](underline),',
        'that ye may be filled with [this love](highlight),',
        'which he hath bestowed upon all who are',
        'true followers of his Son, Jesus Christ.”',
        '',
        '-- Moroni 7:48'
    ].join('\n');

    /* Two pens per verse. They are listed in pairs rather than drawn from two
       separate lists, so the marker never lands next to a colour it fights. */
    var PALETTES = [
        { accent: '#e352bc', marker: '#f6d976' },   /* magenta  / butter  */
        { accent: '#c2452d', marker: '#f6d976' },   /* red pen  / butter  */
        { accent: '#1f7a8c', marker: '#ffd2a6' },   /* teal     / peach   */
        { accent: '#3b56c4', marker: '#ffe08a' },   /* indigo   / amber   */
        { accent: '#7b3fc4', marker: '#dcea94' },   /* violet   / lime    */
        { accent: '#2e7d4f', marker: '#ffd0e2' },   /* forest   / rose    */
        { accent: '#cf6a1f', marker: '#c3e6f7' }    /* burnt orange / sky */
    ];

    /* Deals a pair onto the root element, where the doodles read it (the pen
       pulls --accent at the moment it draws) and every effect that carries
       colour picks it up. The glow is light rather than ink, so it gets the
       accent darkened for the letterforms and the plain accent at two
       strengths for the halo. */
    function dealColours() {
        var p = PALETTES[Math.floor(Math.random() * PALETTES.length)];
        var n = parseInt(p.accent.slice(1), 16);
        var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        var rgb = r + ',' + g + ',' + b;
        var root = document.documentElement.style;
        root.setProperty('--accent', p.accent);
        root.setProperty('--accent-deep', 'rgb(' + Math.round(r * 0.72) + ',' +
                                                   Math.round(g * 0.72) + ',' +
                                                   Math.round(b * 0.72) + ')');
        root.setProperty('--glow-near', 'rgba(' + rgb + ',.75)');
        root.setProperty('--glow-far',  'rgba(' + rgb + ',.32)');
        root.setProperty('--marker', p.marker);
    }

    var quoteEl = document.getElementById('quote');
    var caretEl = document.getElementById('caret');
    var sources = [];
    var index = -1;            /* what is on the wall now; -1 before the first */
    var bag = [];              /* verses not yet drawn this pass through */
    var holdTimer = null;

    function load(name) {
        return fetch(name, { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.text() : null; })
            .catch(function () { return null; });
    }

    /* Probe for the verse files once at startup: scripture1, scripture2 and so
       on, a block of them per round trip, until a block comes back empty. */
    function discover() {
        var found = [];
        function block(start) {
            if (start > MAX_FILES) { return Promise.resolve(found); }
            var names = [];
            for (var n = start; n < start + PROBE_BLOCK && n <= MAX_FILES; n++) {
                names.push('scripture' + n + '.txt');
            }
            return Promise.all(names.map(load)).then(function (texts) {
                var any = false;
                for (var i = 0; i < texts.length; i++) {
                    if (texts[i] && texts[i].trim()) { found.push(texts[i]); any = true; }
                }
                return any ? block(start + PROBE_BLOCK) : found;
            });
        }
        return block(1);
    }

    /* Which verse goes up next. Random, but drawn from a bag: every verse is
       shown once before any is shown a second time, and the bag never opens on
       the verse that just finished, so nothing repeats back to back. */
    function draw() {
        if (sources.length < 2) { return 0; }
        if (!bag.length) {
            for (var i = 0; i < sources.length; i++) { bag.push(i); }
            for (var j = bag.length - 1; j > 0; j--) {
                var k = Math.floor(Math.random() * (j + 1));
                var swap = bag[j]; bag[j] = bag[k]; bag[k] = swap;
            }
            /* draw() takes from the end, so that is the one to move. */
            var last = bag.length - 1;
            if (bag[last] === index) {
                var other = Math.floor(Math.random() * last);
                bag[last] = bag[other]; bag[other] = index;
            }
        }
        return bag.pop();
    }

    function show(src) {
        clearTimeout(holdTimer);
        dealColours();
        Doodles.wipe(true);
        quoteEl.classList.remove('out');
        Quote.play(quoteEl, caretEl, src, function () {
            Doodles.ambient();
            holdTimer = setTimeout(next, HOLD_MS);
        });
    }

    function next() {
        index = draw();
        quoteEl.classList.add('out');
        Quote.stop();
        setTimeout(function () { show(sources[index]); }, 950);
    }

    /* One owner for resize: the type has to be re-fitted to the new stage
       before the doodles are redrawn onto the words.

       This watches the stage rather than the window, because a window resize
       event is not the only way the stage can change size -- the viewport a
       browser reports in the first frames is not always the one it settles on,
       and a fit measured against that early value would otherwise stay wrong
       for the life of the quote. */
    var resizeTimer = null;
    function restage() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            Quote.refit();
            Doodles.redraw();
        }, 160);
    }
    if (window.ResizeObserver) {
        new ResizeObserver(restage).observe(document.getElementById('stage'));
    } else {
        window.addEventListener('resize', restage);
    }

    /* The same for a face that lands late. Startup waits for the fonts before
       anything is measured, but a slow or re-tried fetch can still deliver one
       after a quote is already laid out -- and a quote fitted against fallback
       metrics is a quote whose doodles are drawn around words that have since
       moved. Re-fitting and redrawing costs nothing when nothing changed. */
    if (document.fonts) {
        document.fonts.addEventListener('loadingdone', restage);
    }

    /* Authoring keys: space finishes the quote now, N moves on, R restarts. */
    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') { e.preventDefault(); Quote.skip(); }
        else if (e.key === 'n' || e.key === 'N') { clearTimeout(holdTimer); next(); }
        else if (e.key === 'r' || e.key === 'R') { clearTimeout(holdTimer); show(sources[index]); }
    });

    /* The fonts have to be in before anything is measured: the whole point of
       laying the text out before typing it is that the geometry is final, and
       it is not final while Courier is still standing in for Special Elite.
       document.fonts.ready alone is not enough -- with no text on the page yet
       there is nothing for it to wait on, so the faces are requested by hand. */
    function fontsIn() {
        if (!document.fonts) { return Promise.resolve(); }
        return Promise.all([
            document.fonts.load('1em "Special Elite"'),
            document.fonts.load('1em "Caveat"'),
            document.fonts.load('500 1em "WindSong"')
        ]).catch(function () { /* offline kiosk: fall back and carry on */ })
          .then(function () { return document.fonts.ready; });
    }

    Promise.all([discover(), fontsIn()])
        .then(function (results) {
            sources = results[0];
            if (!sources.length) {
                /* One verse and no rotation is exactly what a reader sees when
                   the files could not be fetched at all, so say which it is
                   rather than letting it look like a stuck rotation. */
                sources = [FALLBACK];
                showError('No scripture*.txt files could be read, so this is the ' +
                          'built-in verse and nothing will rotate.\n' +
                          'The page has to be served over http: opened straight ' +
                          'off disk (file://) the browser refuses to fetch them.\n' +
                          'From this folder:  python -m http.server 8000');
            }
            Doodles.init(document.getElementById('doodles'));
            index = draw();
            show(sources[index]);
        })
        .catch(showError);
})();
</script>
</body>
</html>
