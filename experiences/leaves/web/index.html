   * as leaves silently disappearing mid-season rather than as a quality
   * setting. It was also sticky across seasons, so once it fired the canopy
   * never came back.
   *
   * Render scale is the honest version of the same trade. Halving it quarters
   * the pixels being shaded — which is where the time actually goes, since
   * thousands of overlapping leaf fills are bounded by fill area and not by
   * call count — while every leaf stays exactly where the model put it. The
   * hysteresis is wide and the windows are long, because a backing store that
   * resizes whenever the frame rate wobbles is its own kind of ugly.
   */
  var perfAcc = 0, perfN = 0, slowRuns = 0, fastRuns = 0;

  function perfTick(real) {
    if (!real) return;
    perfAcc += real; perfN++;
    if (perfN < 45) return;
    var fps = perfN / perfAcc;
    perfAcc = 0; perfN = 0;

    // Respond before the stutter is unpleasant rather than after, but keep the
    // band between the two thresholds wide enough that a machine sitting near
    // the boundary does not resize its backing store back and forth.
    if (fps < 40) {
      fastRuns = 0;
      if (++slowRuns >= 3 && qualityStep < QUALITY.length - 1) {
        qualityStep++; slowRuns = 0; resize();
      }
    } else if (fps > 56) {
      slowRuns = 0;
      if (++fastRuns >= 8 && qualityStep > 0) { qualityStep--; fastRuns = 0; resize(); }
    } else { slowRuns = 0; fastRuns = 0; }
    var held = 0;
    for (var i = 0; i < sc.trees.length; i++) {
      var lv = sc.trees[i].leaves;
      for (var j = 0; j < lv.length; j++) if (lv[j].attached) held++;
    }
    // The standalone page printed this into the controls panel. There is no
    // panel on the wall, so it goes on `window` instead: reachable from a
    // headless capture or a remote debug session, invisible to a passer-by.
    window.__leaves = {
      leaves: sc.leaves, held: held, falling: sc.falling.length,
      litter: sc.litter.length, fps: Math.round(fps),
      renderScale: QUALITY[qualityStep]
    };
  }

  /* ==========================================================================
   * 11. HUD
   * ========================================================================*/
  function el(id) { return document.getElementById(id); }

  function speciesStats() {
    var acc2 = {};
    for (var i = 0; i < sc.trees.length; i++) {
      var t = sc.trees[i];
      var a = acc2[t.species] || (acc2[t.species] = { n: 0, held: 0, r: 0, g: 0, b: 0, sen: 0 });
      for (var j = 0; j < t.leaves.length; j++) {
        var leaf = t.leaves[j];
        a.n++;
        if (leaf.attached) {
          a.held++;
          a.r += leaf.rgb[0]; a.g += leaf.rgb[1]; a.b += leaf.rgb[2];
          a.sen += leaf.senescence;
        }
      }
    }
    return acc2;
  }

  // Mean senescence of the leaves still on the branch, as a phase name. The
  // boundaries are where the picture visibly changes rather than round numbers:
  // colour is barely moving below ~0.15, chlorophyll is mostly gone by ~0.5, and
  // past ~0.8 the canopy is browning and shedding hard.
  function turnStage(sen) {
    return sen < 0.15 ? 'still green'
         : sen < 0.50 ? 'turning'
         : sen < 0.80 ? 'full colour'
                      : 'past peak';
  }

  function refreshHud() {
    var e = sc.env;
    el('oDate').textContent = M.doyToLabel(sc.doy);
    el('oDay').textContent = 'day ' + sc.day + ' / ' + M.SEASON_DAYS;
    el('oTmin').textContent = e.tMin.toFixed(1) + ' °C';
    el('oLen').textContent = e.dayLength.toFixed(2) + ' h';
    el('oSun').textContent = e.swMeanWm2 + ' W/m²';
    el('oGust').textContent = e.gust.toFixed(1) + ' m/s';
    el('oFrost').innerHTML = e.hardFreeze
      ? '<span class="badge freeze">HARD FREEZE</span>'
      : e.lightFrost ? '<span class="badge frost">frost</span>'
                     : '<span class="badge none">clear</span>';

    // Precipitation, and what form it is taking at this elevation.
    var sn = sc.snow;
    el('oPrecip').textContent = e.rain < 0.05
      ? 'none'
      : e.rain.toFixed(1) + ' mm ' + (sn.line < SITE_ELEV + 60 ? 'snow' : 'rain');
    // Report the cover you can actually see — the bottom edge of the lying
    // snow — not today's freezing level, which is often above the whole range
    // on a clear day while the peaks are still white from last week's storm.
    el('oSnow').textContent = sn.pack < 0.02 || sn.elev > PEAK_ELEV + 150
      ? 'none'
      : (Math.round(sn.elev / 10) * 10).toLocaleString('en-US') + ' m up · ' +
        Math.round(sn.pack * 100) + '%';

    var st = speciesStats(), html = '', held = 0, tot = 0;
    var order = ['aspen', 'bigtoothMaple', 'gambelOak'];
    for (var i = 0; i < order.length; i++) {
      var k = order[i], a = st[k];
      if (!a) continue;
      held += a.held; tot += a.n;
      var d = a.held || 1;
      var sw = a.held
        ? 'rgb(' + Math.round(a.r / d) + ',' + Math.round(a.g / d) + ',' + Math.round(a.b / d) + ')'
        : 'rgba(255,255,255,.10)';
      // The standalone page printed mean senescence here as a number, which is
      // the right readout for debugging the model and the wrong one for a wall:
      // "sen 0.43" tells a passer-by nothing. Same value, said in words.
      var stage = !a.held ? 'bare' : turnStage(a.sen / d);
      html += '<div class="sp"><span class="sw" style="background:' + sw + '"></span>' +
              '<span class="nm">' + M.SPECIES[k].name + '</span>' +
              '<span class="st">' + Math.round(100 * a.held / a.n) + '% held · ' +
              stage + '</span></div>';
    }
    el('spList').innerHTML = html;
    el('oHeld').textContent = tot ? Math.round(100 * held / tot) + ' %' : '—';
    el('progFill').style.width = (100 * sc.day / M.SEASON_DAYS).toFixed(1) + '%';
    updateCaptions();
  }

  /* ==========================================================================
   * 11b. CONTROL STATE
   *
   * The standalone page kept the environment settings in DOM sliders and read
   * them back out of the inputs. On the wall there are no inputs -- there is no
   * pointer and nothing on screen is touchable -- so the same values live in
   * this plain object instead, written by phone messages (handleMessage) and by
   * the query string, and pushed into sc.controls the same way as before.
   *
   * Keeping them here rather than reading sc.controls directly matters for two
   * of them: `speed` and `dens` are renderer/clock settings that the model does
   * not have fields for, and `dens` needs a scene rebuild rather than just a
   * write. Holding all eight in one place means the phone, the query string and
   * the defaults all go through one path.
   * ========================================================================*/
  var CTL = {
    tempOffset:   M.DEFAULT_CONTROLS.tempOffset,
    cloudCover:   M.DEFAULT_CONTROLS.cloudCover,
    windMean:     M.DEFAULT_CONTROLS.windMean,
    precipMult:   M.DEFAULT_CONTROLS.precipMult,
    winterPrecip: M.DEFAULT_CONTROLS.winterPrecip,
    latitude:     M.DEFAULT_CONTROLS.latitude,
    speed:        1,      // x, playback multiplier
    dens:         1       // x, leaf density
  };

  // Ranges, so a phone message cannot push the model somewhere it was never
  // calibrated for. These are the min/max the standalone page's sliders carried.
  var CTL_RANGE = {
    tempOffset:   [-6, 6],
    cloudCover:   [0, 100],
    windMean:     [0, 12],
    precipMult:   [0, 3],
    winterPrecip: [0.3, 1.8],
    latitude:     [30, 46],
    speed:        [0.25, 6],
    dens:         [0.3, 1.6]
  };

  function setCtl(key, value) {
    var r = CTL_RANGE[key];
    if (!r) return false;
    var v = parseFloat(value);
    if (!isFinite(v)) return false;
    CTL[key] = clamp(v, r[0], r[1]);
    return true;
  }

  function pushControls() {
    sc.controls.tempOffset   = CTL.tempOffset;
    sc.controls.cloudCover   = CTL.cloudCover;
    sc.controls.windMean     = CTL.windMean;
    sc.controls.precipMult   = CTL.precipMult;
    sc.controls.winterPrecip = CTL.winterPrecip;
    sc.controls.latitude     = CTL.latitude;
  }

  // Applied after any environment change. Before the season opens, re-seed day 0
  // so the readouts (daylength in particular) answer the new settings straight
  // away instead of waiting for the first tick.
  function applyEnvChange() {
    pushControls();
    if (sc.day === 0) {
      sc.env = M.makeEnvironment(sc.doy, sc.controls, M.makeRng(sc.seed ^ 0xC2B2AE35));
      refreshHud();
    }
  }

  // One day, by hand. Snapping the transition to done is the point: a stepped
  // day should show its own colours, not sit half-way out of yesterday's.
  function stepOne() {
    if (!stepDay()) return;
    sc.dayT = 1;
    advanceVis(1, 0);
    maybeRefreshColors(true, -1e9);
  }

  function setPlaying(v) { playing = v; }

  function replaySeason() { acc = 0; resetSeason(); setPlaying(true); }

  function newWoods() {
    acc = 0;
    sc.seed = (sc.seed * 1664525 + 1013904223) >>> 0;
    buildScene();
    setPlaying(true);
  }

  // Kept for local development in a desktop browser -- the wall delivers no
  // keyboard events. The standalone page's `C` binding is gone with the slider
  // panel it opened.
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); setPlaying(!playing); }
    else if (ev.code === 'ArrowRight') { ev.preventDefault(); setPlaying(false); stepOne(); }
  });

  window.addEventListener('resize', resize);

  /* ==========================================================================
   * 11c. CAPTIONS
   *
   * Narration for a passer-by who has not touched their phone and will watch for
   * maybe thirty seconds. Each caption is keyed to a SEASON DAY WINDOW rather
   * than to wall-clock time, so it appears alongside the thing it describes at
   * any playback speed -- and several carry a `when` predicate so they only fire
   * if the model actually did that this season. A frost caption on a season that
   * never froze would be worse than no caption.
   *
   * One shows at a time, and each is held for a fixed fraction of its window so
   * a fast playback speed does not leave text on screen after the moment passed.
   * ========================================================================*/
  var capEl = el('caption'), capTextEl = el('captionText');

  var CAPTIONS = [
    { from: 2, to: 14,
      text: 'Every leaf here is simulated. Cool nights and shortening days, not the calendar, decide when each one turns.' },
    { from: 14, to: 26,
      text: 'The green is chlorophyll. The yellow is already there underneath it all summer, waiting to be uncovered.' },
    { from: 26, to: 40,
      text: 'Quaking aspen goes first. It reads temperature alone and ignores day length, so it turns while the others are still green.',
      when: function (st) { return st.aspen && st.aspen.turning; } },
    { from: 40, to: 55,
      text: 'Red is different: the tree has to build it. Anthocyanin is made fresh in autumn from sugar, sunlight, and cold nights.' },
    { from: 55, to: 70,
      text: 'That is why a sunny, frost-free autumn is the brilliant one. Cloud means less sugar, and less sugar means duller reds.' },
    { from: 62, to: 78,
      text: 'Bigtooth maple carries most of the colour on a Wasatch hillside. It makes the most red of the three.' },
    { from: 70, to: 86,
      text: 'A freeze does not just slow the red down, it ends it. The machinery that makes anthocyanin is destroyed outright.',
      when: function (st) { return st.frosted; } },
    { from: 78, to: 94,
      text: 'Wind never makes a leaf fall on its own. It only hurries along one the tree has already cut loose.' },
    { from: 86, to: 104,
      text: 'Some Gambel oak leaves never form an abscission layer at all, and hang on brown all winter. That is marcescence.' },
    { from: 100, to: 120,
      text: 'Snow arrives as a freezing level, not as weather: rain in the meadow is white on the ridge by morning.' }
  ];

  var capIdx = -1, capShownAt = -1;

  function seasonState() {
    var st = { frosted: sc.frostDays > 0.5 };
    var counts = {};
    for (var i = 0; i < sc.trees.length; i++) {
      var t = sc.trees[i];
      var a = counts[t.species] || (counts[t.species] = { n: 0, sen: 0 });
      for (var j = 0; j < t.leaves.length; j++) {
        a.n++;
        a.sen += t.leaves[j].senescence;
      }
    }
    Object.keys(counts).forEach(function (k) {
      var a = counts[k];
      st[k === 'bigtoothMaple' ? 'maple' : k === 'gambelOak' ? 'oak' : 'aspen'] =
        { turning: a.n ? a.sen / a.n > 0.35 : false };
    });
    return st;
  }

  function updateCaptions() {
    var day = sc.day, st = null;
    var pick = -1;
    for (var i = 0; i < CAPTIONS.length; i++) {
      var c = CAPTIONS[i];
      if (day < c.from || day >= c.to) continue;
      if (c.when) {
        if (!st) st = seasonState();
        if (!c.when(st)) continue;
      }
      // Hold the one already showing if it is still inside its window, so an
      // overlapping pair does not swap back and forth on adjacent days.
      if (i === capIdx) { pick = i; break; }
      if (pick < 0) pick = i;
    }

    if (pick === capIdx) return;

    if (pick < 0) {
      capEl.classList.remove('visible');
      capIdx = -1;
      return;
    }
    // Fade the old one out before the new text lands, so the swap is never a
    // visible re-flow of a caption that is still fully opaque.
    capEl.classList.remove('visible');
    capIdx = pick;
    capShownAt = day;
    var text = CAPTIONS[pick].text;
    setTimeout(function () {
      if (capIdx !== pick) return;
      capTextEl.textContent = text;
      capEl.classList.add('visible');
    }, 300);
  }

  /* ==========================================================================
   * 11d. CONTROL MESSAGES FROM THE PHONE
   *
   * The client is mounted at the top of this script so a rendering failure
   * cannot also take the phone connection down with it -- otherwise a display
   * bug shows up on the phone as "disconnected", with nothing to say the problem
   * is on the wall's side. Messages that arrive before this script finishes
   * initialising are queued there and flushed at the bottom.
   * ========================================================================*/
  function handleMessage(message) {
    if (!message || typeof message !== 'object') return;
    switch (message.type) {
      // --- the six environment settings, all `{type, value}` -------------
      case 'temp':         if (setCtl('tempOffset', message.value))   applyEnvChange(); break;
      case 'cloud':        if (setCtl('cloudCover', message.value))   applyEnvChange(); break;
      case 'wind':         if (setCtl('windMean', message.value))     applyEnvChange(); break;
      case 'precip':       if (setCtl('precipMult', message.value))   applyEnvChange(); break;
      case 'winterPrecip': if (setCtl('winterPrecip', message.value)) applyEnvChange(); break;
      case 'latitude':     if (setCtl('latitude', message.value))     applyEnvChange(); break;

      case 'speed':
        setCtl('speed', message.value);
        break;

      case 'density':
        // Geometry changed, so the woods have to be rebuilt -- this is the one
        // control that cannot just be written and left.
        if (setCtl('dens', message.value)) {
          sc.dens = CTL.dens;
          pushControls();
          buildScene();
        }
        break;

      case 'play':
        setPlaying(message.value === undefined ? !playing : !!message.value);
        break;

      case 'step':
        setPlaying(false);
        stepOne();
        break;

      case 'replay':
        replaySeason();
        break;

      case 'newWoods':
        newWoods();
        break;

      case 'resume':
        // Nobody is driving any more: back to defaults and an unattended season,
        // the way the wall should look when it is left alone.
        Object.keys(M.DEFAULT_CONTROLS).forEach(function (k) { CTL[k] = M.DEFAULT_CONTROLS[k]; });
        CTL.speed = 1;
        if (CTL.dens !== 1) { CTL.dens = 1; sc.dens = 1; pushControls(); buildScene(); }
        else applyEnvChange();
        setPlaying(true);
        break;

      default:
        console.warn('Unrecognized message type', message.type);
    }
  }

  window.messageHandler = handleMessage;   // purely for local testing

  /* ==========================================================================
   * 12. QUERY STRING
   *
   * ?day=62&seed=9&paused=1&temp=-2&cloud=70 ... — a specific day of a specific
   * season is reproducible from a URL, which is how a still gets captured and
   * how two settings get compared side by side.
   * ========================================================================*/
  // Returns true if it took over scene construction.
  function applyQuery() {
    var q = window.location.search;
    if (!q || q.length < 2) return false;
    var p = {};
    q.slice(1).split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      p[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1));
    });
    // Query keys map onto CTL keys. `lat` keeps its short spelling because the
    // standalone page's URLs use it and those URLs are in plan.md.
    var keys = { temp: 'tempOffset', winterPrecip: 'winterPrecip', cloud: 'cloudCover',
                 wind: 'windMean', precip: 'precipMult', lat: 'latitude',
                 dens: 'dens', speed: 'speed' };
    Object.keys(keys).forEach(function (k) {
      if (p[k] != null) setCtl(keys[k], p[k]);
    });
    if (p.seed != null && isFinite(parseFloat(p.seed))) sc.seed = parseFloat(p.seed) >>> 0;
    sc.dens = CTL.dens;
    pushControls();
    buildScene();
    if (p.day != null) {
      // Fast-forward the model, not the clock: every intervening day is really
      // simulated, so the leaves arrive with the history they should have.
      var target = clamp(parseInt(p.day, 10) || 0, 0, M.SEASON_DAYS);
      // Release each day's leaves as that day passes. stepDay only QUEUES them
      // now, and the queue is normally drained from advanceVis, which the frame
      // loop drives — nothing is driving it here, so without this the whole
      // season's worth of dropped leaves would still be hanging on the branches.
      while (sc.day < target && stepDay()) releasePending(1);
      // Settle the leaves that fell on the way, so the litter is on the ground
      // rather than raining down all at once. `air` settles only briefly instead,
      // leaving a drift of leaves spread through the air at mixed heights —
      // which is what a still of a real leaf-fall day looks like, and the only
      // way to inspect how airborne leaves are ordered against the trees.
      var settle = p.air ? 55 : 400;
      for (var g = 0; g < settle && sc.falling.length; g++) stepFalling(1 / 30);
      // The smoothed weather has to catch up too. Easing from day 0 would paint
      // August light and a bare skyline over an October canopy.
      resetVis();
      sc.snow.elevDrawn = sc.snow.elev;
      sc.dayT = 1;
      computeLight();
      maybeRefreshColors(true, -1e9);
    }
    if (p.paused) setPlaying(false);
    if (p.still) { setPlaying(false); still = true; }
    // ?nohud hides the overlays entirely -- that is how config.json's wide.jpg
    // and thumb.jpg get captured as a clean picture of the scene.
    if (p.nohud) {
      var huds = document.querySelectorAll('.hud');
      for (var h = 0; h < huds.length; h++) huds[h].style.display = 'none';
      document.getElementById('build-marker').style.display = 'none';
    }
    return true;
  }

  /* ------------------------------------------------------------------ start */
  resize();
  pushControls();
  if (!applyQuery()) buildScene();
  computeLight();
  requestAnimationFrame(frame);

  // Everything handleMessage touches now exists, so it is safe to run anything
  // that arrived from the phone while this script was still initialising.
  messagingReady = true;
  for (var pm = 0; pm < pendingMessages.length; pm++) handleMessage(pendingMessages[pm]);
  pendingMessages.length = 0;
})();
</script>
</body>
</html>
